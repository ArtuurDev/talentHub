name: Build and Push

on:
  push:
    branches:
    - main
    paths:
      - 'services/notification-service/**'

permissions:
  contents: write   
  pull-requests: write 
  issues: write

jobs:
  build:
    name: Continuos Integration - Notification Service
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Semantic Release
      uses: cycjimmy/semantic-release-action@v6
      with: 
        working_directory: ./services/notification-service
      env: 
        GITHUB_TOKEN: ${{secrets.GH_TOKEN}}
